YAML
name: Compilar Python a EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar el código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar PyInstaller y dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Si usas librerías extra (ej: customtkinter, pillow), quita el # e instálalas:
        # pip install customtkinter pillow

    - name: Compilar a ejecutable con icono
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="BT3_no_green.ico" "DBZ STORY EDITOR V1.2.py"

    - name: Subir ejecutable compilado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: DBZ-Story-Editor
        path: dist/
      with:
        name: BT3-Story-Mode-Editor
        path: dist/
