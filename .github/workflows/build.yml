name: Compilar EXE de Windows

on:
  push:
    branches: [ "main" ]  # Cambia a "master" si tu rama principal se llama así
  workflow_dispatch:        # Permite ejecutar el proceso manualmente desde GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Obtener código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Si tienes más dependencias, descomenta la siguiente línea:
        # pip install -r requirements.txt

    - name: Compilar ejecutable con PyInstaller
      run: |
        pyinstaller --onefile --noconsole main.py
        # Reemplaza main.py por el nombre de tu archivo ejecutable principal

    - name: Guardar el ejecutable como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: MiAplicacion-Windows
        path: dist/*.exe
